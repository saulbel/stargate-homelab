apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: external-dns
  namespace: infra
spec:
  interval: 1h
  subscriptions:
    - chart:
        repoURL: oci://registry-1.docker.io/bitnamicharts/external-dns
        semverConstraint: "^6.36.1"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: external-dns
  namespace: infra
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: external-dns
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: git@github.com:saulbel/stargate-homelab.git
        - name: chartVersion
          value: ${{ trimPrefix(chartFrom("oci://registry-1.docker.io/bitnamicharts/external-dns").Version, "v") }}
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ./src
        - uses: yaml-update
          config:
            path: ./src/kubernetes/argocd/clusters/components/software-base/external-dns.yaml
            updates:
              - key: spec.sources.0.targetRevision
                value: ${{ vars.chartVersion }}
        - uses: git-commit
          config:
            path: ./src
            message: bump external-dns chart to ${{ vars.chartVersion }}
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: external-dns
                namespace: argocd
