provider:
  name: webhook
  webhook:
    image:
      repository: ghcr.io/muhlba91/external-dns-provider-adguard
      tag: v8.0.0
    env:
      - name: LOG_LEVEL
        value: debug
      - name: ADGUARD_URL
        valueFrom:
          secretKeyRef:
            name: adguard-webhook-secret
            key: adguard-url
      - name: ADGUARD_USER
        valueFrom:
          secretKeyRef:
            name: adguard-webhook-secret
            key: adguard-user
      - name: ADGUARD_PASSWORD
        valueFrom:
          secretKeyRef:
            name: adguard-webhook-secret
            key: adguard-password
      - name: SERVER_HOST
        value: 0.0.0.0
      - name: DRY_RUN
        value: "false"

sources:
  - service
  - ingress
  - istio-virtualservice

policy: upsert-only
registry: txt
interval: 1m
