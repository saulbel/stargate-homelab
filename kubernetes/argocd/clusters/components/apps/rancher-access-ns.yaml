apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: rancher-access-ns
  namespace: argocd
spec:
  destination:
    server: 'https://kubernetes.default.svc'
  source:
    path: kubernetes/argocd/clusters/addons/apps/rancher-access/ns
    repoURL: git@github.com:saulbel/stargate-homelab.git
    targetRevision: main
  project: default
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    automated:
      prune: true
      selfHeal: false
