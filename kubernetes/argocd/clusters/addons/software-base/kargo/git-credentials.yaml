# Infisical keys: KARGO_GIT_SSH_KEY (deploy key with write access on stargate-homelab)
# SSH credentials are deprecated in Kargo v1.10.0 and removed in v1.13.0
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stargate-homelab-git
  namespace: infra
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-global
    kind: ClusterSecretStore
  target:
    name: stargate-homelab-git
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          kargo.akuity.io/cred-type: git
      data:
        repoURL: git@github.com:saulbel/stargate-homelab.git
        sshPrivateKey: "{{ .sshPrivateKey }}"
  data:
    - secretKey: sshPrivateKey
      remoteRef:
        key: KARGO_GIT_SSH_KEY
