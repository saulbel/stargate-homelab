name: renovate

on:
  schedule:
    - cron: "0 10 * * 0"
    - cron: "0 11 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: only first sunday of the month at 12:00 madrid time
        id: gate
        run: |
          export TZ=Europe/Madrid
          if [ "${{ github.event_name }}" = "schedule" ] && { [ "$(date +%-d)" -gt 7 ] || [ "$(date +%-H)" -ne 12 ]; }; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7.0.1
        if: steps.gate.outputs.run == 'true'
      - uses: renovatebot/github-action@v46.3.13
        if: steps.gate.outputs.run == 'true'
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_GIT_AUTHOR: "saulbel <97754610+saulbel@users.noreply.github.com>"
          RENOVATE_ONBOARDING: "false"
          LOG_LEVEL: info
