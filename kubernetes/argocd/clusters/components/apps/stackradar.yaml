apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: stackradar
  namespace: argocd
spec:
  destination:
    namespace: stackradar
    server: 'https://kubernetes.default.svc'
  sources:
    - chart: stackradar
      repoURL: ghcr.io/lockdep/helm-charts
      targetRevision: 0.2.2
      helm:
        valueFiles:
          - $values/kubernetes/argocd/clusters/addons/apps/stackradar/values.yaml
    - path: kubernetes/argocd/clusters/addons/apps/stackradar
      repoURL: git@github.com:saulbel/stargate-homelab.git
      targetRevision: main
      ref: values
  project: default
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: false
