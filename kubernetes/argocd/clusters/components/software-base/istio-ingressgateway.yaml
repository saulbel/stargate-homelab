apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: istio-ingressgateway
  namespace: argocd
spec:
  destination:
    namespace: istio-ingress
    server: 'https://kubernetes.default.svc'
  sources:
    - chart: gateway
      repoURL: https://istio-release.storage.googleapis.com/charts
      targetRevision: 1.24.2
      helm:
        valueFiles:
          - $values/kubernetes/argocd/clusters/addons/software-base/istio-ingressgateway/values.yaml
    - path: kubernetes/argocd/clusters/addons/software-base/istio-ingressgateway
      repoURL: git@github.com:saulbel/stargate-homelab.git
      targetRevision: main
      ref: values
  project: default
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
