services:
  postgres:
    image: postgres:18-alpine
    env_file: .env
    environment:
      - TZ=Europe/Madrid
      # included in .env file
      # - POSTGRES_USER=postgres
      # - POSTGRES_PASSWORD=
    volumes:
      - ./pg_data:/var/lib/postgresql
    ports:
      - 5432:5432
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # one role and one database for each app:
  # docker compose exec postgres psql -U postgres \
  #   -c "CREATE ROLE <app> LOGIN PASSWORD '<password>'" \
  #   -c "CREATE DATABASE <app> OWNER <app>"

  watchtower:
    image: nickfedor/watchtower:1.23.2
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Madrid
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
      - WATCHTOWER_NO_RESTART=false
      - WATCHTOWER_TIMEOUT=30s
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=playground
      - WATCHTOWER_SCHEDULE=0 0 12 * * 0
