apiVersion: provisioning.cattle.io/v1
kind: Cluster
metadata:
  name: k3s
  namespace: fleet-default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  cloudCredentialSecretName: cattle-global-data:cc-t4rnr
  kubernetesVersion: v1.35.10+k3s1
  rkeConfig:
    machineGlobalConfig:
      disable:
      - servicelb
      - traefik
      - local-storage
    machinePools:
    - controlPlaneRole: true
      etcdRole: true
      machineConfigRef:
        apiVersion: rke-machine-config.cattle.io/v1
        kind: PveConfig
        name: k3s-masters
      name: masters
      quantity: 1
    - machineConfigRef:
        apiVersion: rke-machine-config.cattle.io/v1
        kind: PveConfig
        name: k3s-workers
      name: workers
      quantity: 2
      workerRole: true
    upgradeStrategy:
      controlPlaneDrainOptions:
        deleteEmptyDirData: true
        disableEviction: false
        enabled: true
        force: false
        gracePeriod: -1
        skipWaitForDeleteTimeoutSeconds: 0
        timeout: 0
      workerDrainOptions:
        deleteEmptyDirData: true
        disableEviction: false
        enabled: true
        force: false
        gracePeriod: -1
        skipWaitForDeleteTimeoutSeconds: 0
        timeout: 0
