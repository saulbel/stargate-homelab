apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kargo
  namespace: argocd
spec:
  destination:
    namespace: kargo
    server: 'https://kubernetes.default.svc'
  sources:
    - chart: kargo
      repoURL: ghcr.io/akuity/kargo-charts
      targetRevision: 1.12.5
      helm:
        valueFiles:
          - $values/kubernetes/argocd/clusters/addons/software-base/kargo/values.yaml
    - path: kubernetes/argocd/clusters/addons/software-base/kargo
      repoURL: git@github.com:saulbel/stargate-homelab.git
      targetRevision: main
      ref: values
  project: default
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
