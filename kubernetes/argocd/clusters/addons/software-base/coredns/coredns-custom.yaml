# k3s owns the main `coredns` ConfigMap and re-applies it on restarts, so only
# extend it through `coredns-custom` (imported by the stock Corefile).
apiVersion: v1
kind: ConfigMap
metadata:
  name: coredns-custom
  namespace: kube-system
# No custom server blocks. A `ts.net` block forwarding to 100.100.100.100 was
# removed: CoreDNS runs on a node where that address does not answer, and the
# search domain of the nodes made every external lookup wait 5 s for it.
# Pods reach the tailnet through the `ubuntu-arm` egress Service instead.
data: {}
