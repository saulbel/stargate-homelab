apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: external-secrets
  namespace: infra
spec:
  interval: 1h
  subscriptions:
    - chart:
        repoURL: https://charts.external-secrets.io
        name: external-secrets
        semverConstraint: "^0.18.0"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: external-secrets
  namespace: infra
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: external-secrets
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: git@github.com:saulbel/stargate-homelab.git
        - name: chartVersion
          value: ${{ trimPrefix(chartFrom("https://charts.external-secrets.io", "external-secrets").Version, "v") }}
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ./src
        - uses: yaml-update
          config:
            path: ./src/kubernetes/argocd/clusters/components/software-base/external-secrets.yaml
            updates:
              - key: spec.sources.0.targetRevision
                value: ${{ vars.chartVersion }}
        - uses: git-commit
          config:
            path: ./src
            message: bump external-secrets chart to ${{ vars.chartVersion }}
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: external-secrets
                namespace: argocd
