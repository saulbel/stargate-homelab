apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: stackradar
  namespace: stackradar
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-global
    kind: ClusterSecretStore
  target:
    name: stackradar
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        url: "postgresql://stackradar:{{ .dbpassword }}@192.168.1.21:5432/stackradar?sslmode=prefer"
  data:
    - secretKey: dbpassword
      remoteRef:
        key: STACKRADAR_DB_PASSWORD
    - secretKey: internal-service-key
      remoteRef:
        key: STACKRADAR_INTERNAL_SERVICE_KEY
    - secretKey: api-key-encryption-key
      remoteRef:
        key: STACKRADAR_API_KEY_ENCRYPTION_KEY
    - secretKey: auth-secret
      remoteRef:
        key: STACKRADAR_AUTH_SECRET
    - secretKey: admin-password
      remoteRef:
        key: STACKRADAR_ADMIN_PASSWORD
    - secretKey: cluster-id
      remoteRef:
        key: STACKRADAR_SCANNER_CLUSTER_ID
    - secretKey: api-key
      remoteRef:
        key: STACKRADAR_SCANNER_API_KEY
