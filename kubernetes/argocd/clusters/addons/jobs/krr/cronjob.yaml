apiVersion: batch/v1
kind: CronJob
metadata:
  name: krr
  namespace: krr
spec:
  # weekly, same slot as watchtower (Sundays 12:00)
  schedule: "0 12 * * 0"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      ttlSecondsAfterFinished: 3600
      template:
        spec:
          # in-cluster Prometheus is agent-mode only (no query API) - point at the
          # remote-write target instead. The hostname resolves via CoreDNS's
          # ts.net forward zone (addons/software-base/coredns) - don't set
          # dnsPolicy: Default here, it bypasses CoreDNS and breaks resolution.
          serviceAccountName: krr
          restartPolicy: Never
          containers:
            - name: krr
              image: robustadev/krr:v1.17.0
              imagePullPolicy: Always
              command:
                - /bin/sh
                - -c
                - "python krr.py simple --prometheus-url http://ubuntu-arm.tail991cf.ts.net:9090 --max-workers 3 --width 2048"
              resources:
                requests:
                  memory: 1Gi
                limits:
                  memory: 2Gi
