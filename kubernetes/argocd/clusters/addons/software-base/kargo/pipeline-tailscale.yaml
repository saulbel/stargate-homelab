apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: tailscale
  namespace: infra
spec:
  interval: 1h
  subscriptions:
    - chart:
        repoURL: https://pkgs.tailscale.com/helmcharts
        name: tailscale-operator
        semverConstraint: "^1.104.2"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: tailscale
  namespace: infra
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: tailscale
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: git@github.com:saulbel/stargate-homelab.git
        - name: chartVersion
          value: ${{ trimPrefix(chartFrom("https://pkgs.tailscale.com/helmcharts", "tailscale-operator").Version, "v") }}
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ./src
        - uses: yaml-update
          config:
            path: ./src/kubernetes/argocd/clusters/components/software-base/tailscale.yaml
            updates:
              - key: spec.sources.0.targetRevision
                value: ${{ vars.chartVersion }}
        - uses: git-commit
          config:
            path: ./src
            message: bump tailscale chart to ${{ vars.chartVersion }}
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: tailscale
                namespace: argocd
