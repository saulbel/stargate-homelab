apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: kiali
  namespace: infra
spec:
  interval: 1h
  subscriptions:
    - chart:
        repoURL: https://kiali.org/helm-charts
        name: kiali-server
        semverConstraint: "^2.1.0"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: kiali
  namespace: infra
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: kiali
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: git@github.com:saulbel/stargate-homelab.git
        - name: chartVersion
          value: ${{ trimPrefix(chartFrom("https://kiali.org/helm-charts", "kiali-server").Version, "v") }}
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ./src
        - uses: yaml-update
          config:
            path: ./src/kubernetes/argocd/clusters/components/monitoring/kiali.yaml
            updates:
              - key: spec.sources.0.targetRevision
                value: ${{ vars.chartVersion }}
        - uses: git-commit
          config:
            path: ./src
            message: bump kiali chart to ${{ vars.chartVersion }}
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: kiali
                namespace: argocd
