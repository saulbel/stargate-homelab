version: '3.9'
services:
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: minio
    env_file: .env
    #environment:
      # included in .env file
      # - MINIO_ROOT_USER=
      # - MINIO_ROOT_PASSWORD=
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: unless-stopped
    volumes:
      - ./minio_data:/data
    command: server /data --console-address ":9001"
