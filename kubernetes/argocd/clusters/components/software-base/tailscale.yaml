apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale
  namespace: argocd
spec:
  destination:
    namespace: tailscale
    server: 'https://kubernetes.default.svc'
  sources:
    - chart: tailscale-operator
      repoURL: https://pkgs.tailscale.com/helmcharts
      targetRevision: 1.104.2
      helm:
        valueFiles:
          - $values/kubernetes/argocd/clusters/addons/software-base/tailscale/values.yaml
    - path: kubernetes/argocd/clusters/addons/software-base/tailscale
      repoURL: git@github.com:saulbel/stargate-homelab.git
      targetRevision: main
      ref: values
  ignoreDifferences:
    - group: ''
      kind: Service
      name: ubuntu-arm
      jsonPointers:
        - /spec/externalName
  project: default
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      prune: true
      selfHeal: true
