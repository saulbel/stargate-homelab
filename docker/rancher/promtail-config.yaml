server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://ubuntu-arm.tail991cf.ts.net:3100/loki/api/v1/push

scrape_configs:
- job_name: rancher-audit
  static_configs:
  - targets:
      - localhost
    labels:
      job: rancher-audit
      host: rancher
      __path__: /var/log/auditlog/*.log
  pipeline_stages:
  - json:
      expressions:
        user: user.name
  - labels:
      user:
