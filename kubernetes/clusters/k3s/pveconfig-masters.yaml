# sshkeys is not in git on purpose. The live value is kept (server-side apply does not remove it).
# For a new cluster, add sshkeys to the Rancher object by hand or put the key in the cicustom snippet.
apiVersion: rke-machine-config.cattle.io/v1
kind: PveConfig
metadata:
  name: k3s-masters
  namespace: fleet-default
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
agentTimeout: '300'
allowedNodes: ''
apiInsecure: false
apiTokenId: ''
apiTokenSecret: ''
apiUrl: ''
backup: ''
bootDiskDevice: scsi0
bootDiskSize: '0'
caCert: ''
cicustom: vendor=local:snippets/rancher.yaml
ciuser: ''
cloneFormat: ''
cloneStorage: ''
cloudinit: false
cloudinitTimeout: '300'
cores: '2'
description: ''
diskSetupTimeout: '300'
gateway: 192.168.1.127
ha: false
haGroup: ''
ipEnd: 192.168.1.59
ipMode: static
ipPrefix: '24'
ipStart: 192.168.1.50
keepOnFailure: false
linkedClone: false
memory: '4096'
nameservers: 192.168.1.225,192.168.1.1
netBridge: ''
netDevice: net0
netFirewall: ''
netIface: ''
netModel: virtio
netMtu: '0'
netVlanTag: '0'
node: ''
onboot: false
pool: ''
provisionDelay: '30'
searchdomain: ''
skipPermissionCheck: false
sockets: '1'
sshPort: '22'
sshUser: debian
tags: ''
templateTag: ''
templateTagMatch: subset
templateVmid: '200'
vmNamePrefix: ''
vmid: '0'
vmidRange: 210-219
