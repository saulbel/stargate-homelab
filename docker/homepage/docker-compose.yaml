services:
  homepage:
    image: ghcr.io/gethomepage/homepage:latest
    container_name: homepage
    environment:
      - HOMEPAGE_ALLOWED_HOSTS=homepage.home,localhost,127.0.0.1
    # secrets in .env (gitignored):
    # - HOMEPAGE_VAR_PROXMOX_URL=
    # - HOMEPAGE_VAR_PROXMOX_USER=
    # - HOMEPAGE_VAR_PROXMOX_PASS=
    # - HOMEPAGE_VAR_PBS_URL=
    # - HOMEPAGE_VAR_PBS_USER=
    # - HOMEPAGE_VAR_PBS_PASS=
    # - HOMEPAGE_VAR_ADGUARD_URL=
    # - HOMEPAGE_VAR_ADGUARD_USER=
    # - HOMEPAGE_VAR_ADGUARD_PASS=
    # - HOMEPAGE_VAR_PLEX_URL=
    # - HOMEPAGE_VAR_PLEX_KEY=
    # - HOMEPAGE_VAR_TAUTULLI_URL=
    # - HOMEPAGE_VAR_TAUTULLI_KEY=
    # - HOMEPAGE_VAR_SONARR_URL=
    # - HOMEPAGE_VAR_SONARR_KEY=
    # - HOMEPAGE_VAR_RADARR_URL=
    # - HOMEPAGE_VAR_RADARR_KEY=
    # - HOMEPAGE_VAR_JACKETT_URL=
    # - HOMEPAGE_VAR_DELUGE_URL=
    # - HOMEPAGE_VAR_DELUGE_PASS=
    # - HOMEPAGE_VAR_KAVITA_URL=
    # - HOMEPAGE_VAR_KAVITA_USER=
    # - HOMEPAGE_VAR_KAVITA_PASS=
    # - HOMEPAGE_VAR_GRAFANA_HREF=
    # - HOMEPAGE_VAR_GRAFANA_URL=
    # - HOMEPAGE_VAR_GRAFANA_USER=
    # - HOMEPAGE_VAR_GRAFANA_PASS=
    # - HOMEPAGE_VAR_PROMETHEUS_URL=
    # - HOMEPAGE_VAR_LOKI_URL=
    env_file: .env
    ports:
      - 3000:3000
    volumes:
      - ./config:/app/config # Make sure your local config directory exists
      - ./icons:/app/public/icons
        #- /var/run/docker.sock:/var/run/docker.sock:ro # (optional) For docker integrations
      - /mnt/local-storage:/local-storage # For disk api info
    restart: unless-stopped

  watchtower:
    image: nickfedor/watchtower:1.23.2
    container_name: watchtower
    env_file: .env
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - TZ=Europe/Madrid
      - WATCHTOWER_CLEANUP=true
      - WATCHTOWER_INCLUDE_RESTARTING=true
      - WATCHTOWER_INCLUDE_STOPPED=true
      - WATCHTOWER_REVIVE_STOPPED=false
      - WATCHTOWER_NO_RESTART=false
      - WATCHTOWER_TIMEOUT=30s
      - WATCHTOWER_NOTIFICATIONS_HOSTNAME=homepage
      - WATCHTOWER_SCHEDULE=0 0 12 * * 0
      # included in .env file
      # - WATCHTOWER_NOTIFICATION_URL=
