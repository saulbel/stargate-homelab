- hosts: "{{ target }}"
  become: false  # connect as root, debian 13 template has no sudo
  tasks:
    - name: Install system package
      ansible.builtin.apt:
        pkg:
          - ufw
        state: present
        update_cache: true
    - name: Open port 22
      community.general.ufw:
        rule: allow
        port: '22'
        proto: tcp
    - name: Enable ufw
      community.general.ufw:
        state: enabled
        policy: reject
