apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: krr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git@github.com:saulbel/stargate-homelab.git
    targetRevision: main
    path: kubernetes/argocd/clusters/addons/jobs/krr
  destination:
    server: https://kubernetes.default.svc
    namespace: krr
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
