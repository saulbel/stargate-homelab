apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: kargo-admin-secret
  namespace: kargo
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-global
    kind: ClusterSecretStore
  target:
    name: kargo-admin-secret
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ADMIN_ACCOUNT_PASSWORD_HASH
      remoteRef:
        key: KARGO_ADMIN_PASSWORD_HASH
    - secretKey: ADMIN_ACCOUNT_TOKEN_SIGNING_KEY
      remoteRef:
        key: KARGO_TOKEN_SIGNING_KEY
