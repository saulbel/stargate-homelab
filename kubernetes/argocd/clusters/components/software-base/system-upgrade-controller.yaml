apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: system-upgrade-controller
  namespace: argocd
spec:
  destination:
    namespace: system-upgrade
    server: 'https://kubernetes.default.svc'
  sources:
    - path: kubernetes/argocd/clusters/addons/software-base/system-upgrade-controller
      repoURL: git@github.com:saulbel/stargate-homelab.git
      targetRevision: main
  project: default
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: false