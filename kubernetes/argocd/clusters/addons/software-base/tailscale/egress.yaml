# Egress proxy: pods reach the tailnet host via ubuntu-arm.tailscale.svc.cluster.local
apiVersion: v1
kind: Service
metadata:
  name: ubuntu-arm
  namespace: tailscale
  annotations:
    tailscale.com/tailnet-fqdn: ubuntu-arm.tail991cf.ts.net
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: loki
      port: 3100
      protocol: TCP
    - name: prometheus
      port: 9090
      protocol: TCP
