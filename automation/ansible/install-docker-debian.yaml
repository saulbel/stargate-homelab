- hosts: all
  become: yes
  tasks:
    - name: Install some tools
      apt:
        pkg:
          - curl
          - vim
    - name: Install Docker
      apt:
        name: docker.io
        state: present
    - name: Install Docker Compose
      apt:
        name: docker-compose
        state: present
    - name: Add connecting user to docker group
      user:
        name: "{{ ansible_user | default(ansible_user_id) }}"
        groups: docker
        append: yes