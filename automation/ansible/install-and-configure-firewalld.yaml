- hosts: "{{ target }}"
  become: false  # connect as root, debian 13 template has no sudo
  tasks:
    - name: Install system package
      ansible.builtin.apt:
        pkg:
          - firewalld
        state: present
        update_cache: true
    - name: Enable firewalld
      ansible.builtin.systemd:
        name: firewalld
        enabled: true
        state: started
    - name: Allow ssh
      ansible.posix.firewalld:
        zone: public
        service: ssh
        permanent: true
        immediate: true
        state: enabled
