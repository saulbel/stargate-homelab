apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cluster-rancher-local
  namespace: argocd
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: infisical-global
    kind: ClusterSecretStore
  target:
    name: cluster-rancher-local
    creationPolicy: Owner
    template:
      type: Opaque
      metadata:
        labels:
          argocd.argoproj.io/secret-type: cluster
      data:
        name: rancher-local
        server: https://192.168.1.28/k8s/clusters/local
        config: '{"bearerToken":"{{ .token }}","tlsClientConfig":{"insecure":true}}'
  data:
    - secretKey: token
      remoteRef:
        key: RANCHER_ARGOCD_TOKEN
