apiVersion: kargo.akuity.io/v1alpha1
kind: Warehouse
metadata:
  name: cert-manager
  namespace: infra
spec:
  interval: 1h
  subscriptions:
    - chart:
        repoURL: https://charts.jetstack.io
        name: cert-manager
        semverConstraint: "^1.17.2"
---
apiVersion: kargo.akuity.io/v1alpha1
kind: Stage
metadata:
  name: cert-manager
  namespace: infra
spec:
  requestedFreight:
    - origin:
        kind: Warehouse
        name: cert-manager
      sources:
        direct: true
  promotionTemplate:
    spec:
      vars:
        - name: repoURL
          value: git@github.com:saulbel/stargate-homelab.git
        - name: chartVersion
          value: ${{ trimPrefix(chartFrom("https://charts.jetstack.io", "cert-manager").Version, "v") }}
      steps:
        - uses: git-clone
          config:
            repoURL: ${{ vars.repoURL }}
            checkout:
              - branch: main
                path: ./src
        - uses: yaml-update
          config:
            path: ./src/kubernetes/argocd/clusters/components/software-base/cert-manager.yaml
            updates:
              - key: spec.sources.0.targetRevision
                value: ${{ vars.chartVersion }}
        - uses: git-commit
          config:
            path: ./src
            message: bump cert-manager chart to ${{ vars.chartVersion }}
        - uses: git-push
          config:
            path: ./src
        - uses: argocd-update
          config:
            apps:
              - name: cert-manager
                namespace: argocd
