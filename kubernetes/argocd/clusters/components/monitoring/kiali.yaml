apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kiali
  namespace: argocd
  annotations:
    kargo.akuity.io/authorized-stage: "infra:kiali"
spec:
  destination:
    namespace: istio-system
    server: 'https://kubernetes.default.svc'
  sources:
    - chart: kiali-server
      repoURL: https://kiali.org/helm-charts
      targetRevision: 2.34.1
      helm:
        valueFiles:
          - $values/kubernetes/argocd/clusters/addons/monitoring/kiali/values.yaml
    - path: kubernetes/argocd/clusters/addons/monitoring/kiali
      repoURL: git@github.com:saulbel/stargate-homelab.git
      targetRevision: main
      ref: values
  project: default
  syncPolicy:
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
    syncOptions:
      - CreateNamespace=true
      - SkipDryRunOnMissingResource=true
    automated:
      prune: true
      selfHeal: true
